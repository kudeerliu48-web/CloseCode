                <div class="delegation-tabs" role="tablist" aria-label="指定协作对象">
                  <button id="delegation-tab-team" type="button" role="tab" data-delegation-tab="team" aria-selected="true" aria-controls="delegation-results">团队 <span id="delegation-team-count">—</span></button>
                  <button id="delegation-tab-expert" type="button" role="tab" data-delegation-tab="expert" aria-selected="false" aria-controls="delegation-results" tabindex="-1">专家 <span id="delegation-expert-count">—</span></button>
                </div>
                <span class="delegation-catalog-hint">或直接指定</span>
              </div>
              <label class="delegation-search-wrap" for="delegation-search"><svg class="i" aria-hidden="true"><use href="#i-search"></use></svg><input id="delegation-search" type="search" placeholder="搜索团队、专家或擅长领域" aria-label="搜索团队或专家" autocomplete="off"></label>
              <div class="delegation-feedback" id="delegation-feedback" role="status" hidden><span id="delegation-feedback-text"></span><button type="button" id="delegation-retry" hidden>重试</button></div>
              <p class="delegation-selection-note" id="delegation-selection-note" role="status" hidden></p>
              <div class="delegation-results" id="delegation-results" role="tabpanel" aria-labelledby="delegation-tab-team" aria-busy="false"></div>
              <div class="delegation-footer"><span class="delegation-footer-dot" aria-hidden="true"></span><span id="delegation-mode-hint">团队顺序接力，会增加模型调用与费用。</span></div>
            </div>
          </div>
          <div class="grow"></div>
          <button id="remote-mobile-status" type="button" title="远程手机未连接，点击打开智能体设置" style="display:inline-flex;align-items:center;gap:4px;color:var(--wb-text-3);font-size:13px;background:transparent;border:0;padding:4px 6px;cursor:pointer"><span aria-hidden="true">📱</span><span id="remote-mobile-label">手机未连接</span></button>
          <div class="picker" id="thinking-picker">
            <button class="picker-btn" id="thinking-btn"><svg class="i" aria-hidden="true"><use href="#i-zap"></use></svg> <span id="thinking-label">推理强度</span> <svg class="i" aria-hidden="true"><use href="#i-chevron-down"></use></svg></button>
            <div class="picker-menu" id="thinking-menu"></div>
          </div>
          <div class="picker" id="model-picker">
            <button class="picker-btn" id="model-btn"><span id="model-label">模型</span> <svg class="i" aria-hidden="true"><use href="#i-chevron-down"></use></svg></button>
            <div class="picker-menu" id="model-menu"></div>
          </div>
          <button id="interject-btn" title="不等当前任务结束，把这条消息立即注入正在执行的任务"><svg class="i" aria-hidden="true"><use href="#i-zap"></use></svg> 插队</button>
          <button id="send" title="发送"><svg class="i" aria-hidden="true"><use href="#i-arrow-up"></use></svg></button>
        </div>
      </div>
      <div class="quick-bar">
        <div class="picker" id="ws-picker">
          <button class="picker-btn" id="ws-btn"><svg class="i" aria-hidden="true"><use href="#i-folder"></use></svg> <span id="ws-label">选择工作空间</span> <svg class="i" aria-hidden="true"><use href="#i-chevron-down"></use></svg></button>
          <div class="picker-menu up-left" id="ws-menu"></div>
        </div>
        <div class="picker" id="perm-picker">
          <button class="picker-btn" id="perm-btn"><svg class="i" aria-hidden="true"><use href="#i-shield"></use></svg> <span id="perm-label">自动改文件</span> <svg class="i" aria-hidden="true"><use href="#i-chevron-down"></use></svg></button>
          <div class="picker-menu up-left" id="perm-menu"></div>
        </div>
        <div class="picker" id="mode-picker">
          <button class="picker-btn" id="mode-btn"><svg class="i" aria-hidden="true"><use href="#i-circle-check"></use></svg> <span id="mode-label">Craft · 执行</span> <svg class="i" aria-hidden="true"><use href="#i-chevron-down"></use></svg></button>
          <div class="picker-menu up-left" id="mode-menu">
            <div class="mi" data-mode="craft"><svg class="i" aria-hidden="true"><use href="#i-circle-check"></use></svg> Craft · 执行 <span class="sub">完整执行并交付成果</span></div>
            <div class="mi" data-mode="goal"><svg class="i" aria-hidden="true"><use href="#i-target"></use></svg> Goal · 目标 <span class="sub">拆解验收标准，没达成自动再跑</span></div>
            <div class="mi" data-mode="plan"><svg class="i" aria-hidden="true"><use href="#i-map"></use></svg> Plan · 规划 <span class="sub">只出执行计划不动手</span></div>
            <div class="mi" data-mode="ask"><svg class="i" aria-hidden="true"><use href="#i-message-circle"></use></svg> Ask · 问答 <span class="sub">只读问答不改文件</span></div>
          </div>
        </div>
        <div class="grow"></div>
        <div id="context-indicator" style="font-size:13px;color:var(--wb-text-3);display:flex;align-items:center;gap:6px;padding:0 12px;white-space:nowrap;margin-left:auto;">上下文占比：<span id="context-percentage">0%</span></div>
      </div>
    </div>
  </div>
</div>

<div class="preview-panel" id="preview-panel">
  <div class="pv-head">
    <span class="pv-name" id="pv-name"></span>
    <button id="pv-sys" class="icon-btn" title="用系统默认程序打开"><svg class="i" aria-hidden="true"><use href="#i-app-window"></use></svg></button>
    <button id="pv-rv" class="icon-btn" title="打开所在位置"><svg class="i" aria-hidden="true"><use href="#i-folder-open"></use></svg></button>
    <a id="pv-dl" class="icon-btn" href="#" download title="下载" style="text-decoration:none"><svg class="i" aria-hidden="true"><use href="#i-download"></use></svg></a>
    <button id="pv-close" class="icon-btn" title="关闭"><svg class="i" aria-hidden="true"><use href="#i-x"></use></svg></button>
  </div>
  <div class="pv-deploy" id="pv-deploy" style="display:none"></div>
  <div id="pv-body"></div>
</div>

<div class="files-panel" id="files-panel">
  <h2><span><svg class="i" aria-hidden="true"><use href="#i-folder-open"></use></svg> 成果文件</span> <a href="#" id="open-ws" class="link" style="font-weight:400;font-size: 12px">打开文件夹</a><span style="flex:1"></span><button id="fp-close" class="icon-btn" title="关闭"><svg class="i" aria-hidden="true"><use href="#i-x"></use></svg></button></h2>
  <div id="file-list"></div>
</div>

<div class="modal-mask" id="modal-mask">
  <div class="modal" id="modal-box">
    <div class="m-head"><h3 id="m-title"></h3><button class="m-close" id="m-close">✕</button></div>
    <div class="m-body" id="m-body"></div>
  </div>
</div>


<!-- 首次开箱：没有模型 Key 时界面点什么都白点，先把这一步走完 -->
<div class="auth-mask" id="onb-mask" style="display:none">
  <div class="auth-card onb-card">
    <h2>先给它接上一个大模型</h2>
    <div class="sub">DoCode 自己不含模型。挑一家服务商、把 API Key 填进来，我会当场发一条测试请求验活。</div>
    <div class="err" id="onb-err"></div>
    <label class="onb-lb">模型服务商</label>
    <select id="onb-model"></select>
    <div class="onb-tip" id="onb-tip"></div>
    <label class="onb-lb">API Key</label>
    <input id="onb-key" type="password" placeholder="粘贴 API Key" autocomplete="off" spellcheck="false">
    <label class="onb-lb">工作目录（成果文件都放这儿）</label>
    <input id="onb-dir" placeholder="留空就用默认目录">
    <button class="go" id="onb-go">验活并保存</button>
    <div class="alt">
      <a id="onb-skip">先跳过，我一会儿去设置里填</a>
    </div>
  </div>
</div>
